name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            name: jabari-linux-amd64
          - goos: linux
            goarch: arm64
            name: jabari-linux-arm64
          - goos: darwin
            goarch: amd64
            name: jabari-darwin-amd64
          - goos: darwin
            goarch: arm64
            name: jabari-darwin-arm64
          - goos: windows
            goarch: amd64
            name: jabari-windows-amd64.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build binary
        run: |
          mkdir -p dist
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -trimpath \
            -ldflags "-X github.com/anomalyco/qyvora-jabari/internal/version.Version=${{ github.ref_name }}" \
            -o dist/${{ matrix.name }} ./cmd/jabari

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}

  checksums:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
