name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Test
        run: go test ./...

      - name: Build binaries
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-X github.com/anomalyco/qyvora-jabari/internal/version.Version=${{ github.ref_name }}" -o dist/jabari-linux-amd64 ./cmd/jabari
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "-X github.com/anomalyco/qyvora-jabari/internal/version.Version=${{ github.ref_name }}" -o dist/jabari-darwin-arm64 ./cmd/jabari

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
